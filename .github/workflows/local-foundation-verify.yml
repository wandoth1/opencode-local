name: Apply audited local hardening

on:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/local-foundation-verify.yml"

permissions:
  contents: write

concurrency:
  group: local-hardening-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Reconstruct and apply audited source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/local-hardening/chunk-* | base64 --decode > /tmp/local-hardening.tar.gz
          sha256sum /tmp/local-hardening.tar.gz
          tar -tzf /tmp/local-hardening.tar.gz >/dev/null
          tar -xzf /tmp/local-hardening.tar.gz -C .
          rm -rf scripts/local-hardening scripts/local-foundation-update
          rm -f .github/workflows/local-hardening-apply.yml

      - name: Apply compatibility fixes for the current OpenCode config service
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          cli = Path("packages/opencode/src/cli/cmd/local.ts")
          text = cli.read_text(encoding="utf-8")
          text, import_count = re.subn(
              r'(?m)^import \{ Config \} from "@/config/config"$',
              'import { Config } from "../../config/config"',
              text,
          )
          pattern = re.compile(
              r'(?m)^(\s*)const configService = yield\* Config\.Service\n'
              r'\1const \[config, globalConfig\] = yield\* Effect\.all\(\[configService\.get\(\), configService\.getGlobal\(\)\]\)'
          )

          def replace_cli(match: re.Match[str]) -> str:
              indent = match.group(1)
              return (
                  f'{indent}const [config, globalConfig] = yield* Effect.all([\n'
                  f'{indent}  Config.Service.use((service) => service.get()),\n'
                  f'{indent}  Config.Service.use((service) => service.getGlobal()),\n'
                  f'{indent}])'
              )

          text, block_count = pattern.subn(replace_cli, text)
          if import_count != 1 or block_count != 1:
              raise SystemExit(f"local.ts replacements failed: import={import_count}, block={block_count}")
          cli.write_text(text, encoding="utf-8")

          plugin = Path("packages/opencode/src/plugin/index.ts")
          text = plugin.read_text(encoding="utf-8")
          text, plugin_count = re.subn(
              r'(?m)^(\s*)const globalCfg = yield\* config\.getGlobal\(\)$',
              lambda match: f'{match.group(1)}const globalCfg = yield* Config.Service.use((service) => service.getGlobal())',
              text,
          )
          if plugin_count != 1:
              raise SystemExit(f"plugin global-config replacements failed: {plugin_count}")
          plugin.write_text(text, encoding="utf-8")

          integration = Path("packages/opencode/src/local/ollama/integration.ts")
          text = integration.read_text(encoding="utf-8")
          start_marker = "function headers(value: unknown): Record<string, string> | undefined {"
          end_marker = "\n}\n\nexport function resolveOllamaSettings"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("integration headers function was not found")
          replacement = '''function headers(value: unknown): Record<string, string> | undefined {
            if (!value || typeof value !== "object" || Array.isArray(value)) return undefined
            const result: Record<string, string> = {}
            for (const [key, entry] of Object.entries(value)) {
              if (typeof entry === "string") result[key] = entry
            }
            return result
          }'''
          integration.write_text(text[:start] + replacement + text[end + 2 :], encoding="utf-8")
          PY

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Format hardened implementation
        run: |
          bunx prettier@3.6.2 --write \
            packages/opencode/src/local \
            packages/opencode/src/plugin/ollama.ts \
            packages/opencode/src/plugin/index.ts \
            packages/opencode/src/cli/cmd/local.ts \
            packages/opencode/test/local \
            docs/local-foundation

      - name: Typecheck OpenCode
        working-directory: packages/opencode
        run: bun run typecheck

      - name: Run local runtime tests
        working-directory: packages/opencode
        run: bun test test/local --timeout 30000

      - name: Run provider regression tests
        working-directory: packages/opencode
        run: bun test test/provider/provider.test.ts test/plugin/modal-models.test.ts --timeout 30000

      - name: Commit validated hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(local): harden Ollama runtime after independent audit"
          git push origin HEAD:${TARGET_BRANCH}

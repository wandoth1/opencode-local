name: Apply audited local hardening

on:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/local-foundation-verify.yml"

permissions:
  contents: write

concurrency:
  group: local-hardening-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Reconstruct and apply audited source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/local-hardening/chunk-* | base64 --decode > /tmp/local-hardening.tar.gz
          echo "d12063fdd6e87678a37bcc1d0cbc64ff0d204c882f85cad7571d7dde5b36a924  /tmp/local-hardening.tar.gz" | sha256sum --check
          tar -xzf /tmp/local-hardening.tar.gz -C .
          rm -rf scripts/local-hardening scripts/local-foundation-update
          rm -f .github/workflows/local-hardening-apply.yml

      - name: Apply compatibility fixes for the current OpenCode config service
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cli = Path("packages/opencode/src/cli/cmd/local.ts")
          text = cli.read_text(encoding="utf-8")
          text = text.replace('import { Config } from "@/config/config"\n', "")
          old = '''    const configService = yield* Config.Service
              const [config, globalConfig] = yield* Effect.all([configService.get(), configService.getGlobal()])'''
          new = '''    const { Config } = yield* Effect.promise(() => import("../../config/config"))
              const [config, globalConfig] = yield* Effect.all([
                Config.Service.use((service) => service.get()),
                Config.Service.use((service) => service.getGlobal()),
              ])'''
          if old not in text:
              raise SystemExit("local.ts config-service anchor was not found")
          cli.write_text(text.replace(old, new), encoding="utf-8")

          plugin = Path("packages/opencode/src/plugin/index.ts")
          text = plugin.read_text(encoding="utf-8")
          old = "        const globalCfg = yield* config.getGlobal()"
          new = "        const globalCfg = yield* Config.Service.use((service) => service.getGlobal())"
          if old not in text:
              raise SystemExit("plugin global-config anchor was not found")
          plugin.write_text(text.replace(old, new), encoding="utf-8")

          integration = Path("packages/opencode/src/local/ollama/integration.ts")
          text = integration.read_text(encoding="utf-8")
          old = '''function headers(value: unknown): Record<string, string> | undefined {
              if (!value || typeof value !== "object" || Array.isArray(value)) return undefined
              return Object.fromEntries(Object.entries(value).filter((entry): entry is [string, string] => typeof entry[1] === "string"))
            }'''
          new = '''function headers(value: unknown): Record<string, string> | undefined {
              if (!value || typeof value !== "object" || Array.isArray(value)) return undefined
              const result: Record<string, string> = {}
              for (const [key, entry] of Object.entries(value)) {
                if (typeof entry === "string") result[key] = entry
              }
              return result
            }'''
          if old not in text:
              raise SystemExit("integration headers anchor was not found")
          integration.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Format hardened implementation
        run: |
          bunx prettier@3.6.2 --write \
            packages/opencode/src/local \
            packages/opencode/src/plugin/ollama.ts \
            packages/opencode/src/plugin/index.ts \
            packages/opencode/src/cli/cmd/local.ts \
            packages/opencode/test/local \
            docs/local-foundation

      - name: Typecheck OpenCode
        working-directory: packages/opencode
        run: bun run typecheck

      - name: Run local runtime tests
        working-directory: packages/opencode
        run: bun test test/local --timeout 30000

      - name: Run provider regression tests
        working-directory: packages/opencode
        run: bun test test/provider/provider.test.ts test/plugin/modal-models.test.ts --timeout 30000

      - name: Commit validated hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(local): harden Ollama runtime after independent audit"
          git push origin HEAD:${TARGET_BRANCH}

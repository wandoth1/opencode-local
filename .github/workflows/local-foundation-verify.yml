name: Local foundation verification

on:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/local-foundation-verify.yml"
      - "scripts/local-foundation-wire.py"
      - "docs/local-foundation/**"
      - "packages/opencode/src/local/**"
      - "packages/opencode/src/plugin/ollama.ts"
      - "packages/opencode/src/cli/cmd/local.ts"
      - "packages/opencode/test/local/**"

permissions:
  contents: write

jobs:
  verify-and-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Apply deterministic wiring
        run: python3 scripts/local-foundation-wire.py

      - name: Validate patch whitespace
        run: git diff --check

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Format changed TypeScript
        run: |
          bunx prettier@3.6.2 --write \
            packages/opencode/src/local \
            packages/opencode/src/plugin/ollama.ts \
            packages/opencode/src/cli/cmd/local.ts \
            packages/opencode/src/plugin/index.ts \
            packages/opencode/src/index.ts \
            packages/opencode/test/local \
            docs/local-foundation

      - name: Typecheck OpenCode
        id: typecheck
        continue-on-error: true
        shell: bash
        working-directory: packages/opencode
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee ../../docs/local-foundation/ci-typecheck.log

      - name: Run local foundation tests
        id: tests
        if: steps.typecheck.outcome == 'success'
        continue-on-error: true
        shell: bash
        working-directory: packages/opencode
        run: |
          set -o pipefail
          bun test test/local --timeout 30000 --only-failures 2>&1 | tee ../../docs/local-foundation/ci-tests.log

      - name: Commit failure diagnostics
        if: steps.typecheck.outcome == 'failure' || steps.tests.outcome == 'failure'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/local-foundation/ci-typecheck.log
          if [[ -f docs/local-foundation/ci-tests.log ]]; then
            git add docs/local-foundation/ci-tests.log
          fi
          git commit -m "chore(local): capture CI diagnostics [skip ci]"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Commit verified wiring and formatting
        if: steps.typecheck.outcome == 'success' && steps.tests.outcome == 'success'
        shell: bash
        run: |
          rm -f docs/local-foundation/ci-typecheck.log docs/local-foundation/ci-tests.log
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/opencode/src/local \
            packages/opencode/src/plugin/ollama.ts \
            packages/opencode/src/cli/cmd/local.ts \
            packages/opencode/src/plugin/index.ts \
            packages/opencode/src/index.ts \
            packages/opencode/test/local \
            docs/local-foundation
          git commit -m "chore(local): wire and format verified foundation [skip ci]"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Fail verification when checks failed
        if: steps.typecheck.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: exit 1

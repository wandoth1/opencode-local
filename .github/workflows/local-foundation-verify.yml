name: Local foundation verification

on:
  push:
    branches:
      - feature/local-foundation
    paths:
      - ".github/workflows/local-foundation-verify.yml"
      - "scripts/local-foundation-wire.py"
      - "docs/local-foundation/**"
      - "packages/opencode/src/local/**"
      - "packages/opencode/src/plugin/ollama.ts"
      - "packages/opencode/src/cli/cmd/local.ts"
      - "packages/opencode/test/local/**"
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/local-foundation-verify.yml"
      - "scripts/local-foundation-wire.py"
      - "docs/local-foundation/**"
      - "packages/opencode/src/local/**"
      - "packages/opencode/src/plugin/ollama.ts"
      - "packages/opencode/src/cli/cmd/local.ts"
      - "packages/opencode/test/local/**"

permissions:
  contents: write

concurrency:
  group: local-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Apply deterministic wiring
        run: python3 scripts/local-foundation-wire.py

      - name: Validate patch whitespace
        run: git diff --check

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Format changed TypeScript
        run: |
          bunx prettier@3.6.2 --write \
            packages/opencode/src/local \
            packages/opencode/src/plugin/ollama.ts \
            packages/opencode/src/cli/cmd/local.ts \
            packages/opencode/src/plugin/index.ts \
            packages/opencode/src/index.ts \
            packages/opencode/test/local \
            docs/local-foundation

      - name: Typecheck OpenCode
        working-directory: packages/opencode
        run: bun run typecheck

      - name: Run local foundation tests
        working-directory: packages/opencode
        run: bun test test/local --timeout 30000 --only-failures

      - name: Commit verified wiring and formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/opencode/src/local \
            packages/opencode/src/plugin/ollama.ts \
            packages/opencode/src/cli/cmd/local.ts \
            packages/opencode/src/plugin/index.ts \
            packages/opencode/src/index.ts \
            packages/opencode/test/local \
            docs/local-foundation
          git commit -m "chore(local): wire and format verified foundation [skip ci]"
          git push origin "HEAD:${TARGET_BRANCH}"

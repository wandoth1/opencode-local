name: Materialize local foundation wiring

on:
  push:
    branches:
      - feature/local-foundation
    paths:
      - .github/workflows/local-foundation-bootstrap.yml

permissions:
  contents: write

jobs:
  materialize-wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: feature/local-foundation
          fetch-depth: 0

      - name: Apply deterministic wiring
        run: python3 scripts/local-foundation-wire.py

      - name: Commit wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/opencode/src/plugin/index.ts packages/opencode/src/index.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Wiring is already materialized."
            exit 0
          fi
          git commit -m "feat(local): register Ollama runtime and local CLI"
          git push origin HEAD:feature/local-foundation

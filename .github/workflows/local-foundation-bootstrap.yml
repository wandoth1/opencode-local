name: Remove local foundation bootstrap artifacts

on:
  push:
    branches:
      - feature/local-foundation
    paths:
      - .github/workflows/local-foundation-bootstrap.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: feature/local-foundation
          fetch-depth: 0

      - name: Remove temporary materialization files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scripts/local-foundation-patches
          rm -f scripts/local-foundation-wire.py
          rm -f .github/workflows/local-foundation-bootstrap.yml

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(local): remove bootstrap artifacts"
          git push origin HEAD:feature/local-foundation
